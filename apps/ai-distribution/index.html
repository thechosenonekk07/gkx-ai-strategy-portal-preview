 {id:'topology',seq:176,group:'业务数据抓取与接入',name:'底层接入状态雷达拓扑图',desc:'实时查看八个业务系统与中台的连接健康度和心跳状态。',body:()=>{const data=[['业务系统 A','正常','10:46:21','10:46:20','38 ms','0'],['业务系统 B','正常','10:46:20','10:46:18','62 ms','0'],['业务系统 C','延迟','10:45:10','10:41:52','428 ms','2'],['业务系统 D','正常','10:46:19','10:46:16','51 ms','0'],['业务系统 E','离线','10:40:12','10:33:04','—','6'],['业务系统 F','正常','10:46:17','10:46:15','73 ms','0'],['业务系统 G','正常','10:46:16','10:46:14','95 ms','0'],['业务系统 H','正常','10:46:15','10:46:12','66 ms','0']];const node=(r,i,col)=>`<button class=\"top-node\" data-node=\"${i}\" style=\"grid-column:${col};grid-row:${i%4+1}\"><span class=\"top-node-head\"><strong>${r[0]}</strong><span class=\"status ${r[1]==='离线'?'error':r[1]==='延迟'?'warn':''}\">${r[1]}</span></span><span class=\"top-node-meta\"><span>心跳 ${r[2]}</span><span>采集 ${r[3]}</span></span><span class=\"top-node-meta\"><span>延迟 ${r[4]}</span><span>异常 ${r[5]}</span></span></button>`;return `<div class=\"section\"><div class=\"notice\"><strong>监测流程：</strong>集成门户消息组件的业务系统按周期上报自身/组件健康状态；门户记录最近心跳时间并据此判断接入健康度。当前节点和数值为示意数据。</div><div class=\"metrics\"><div class=\"metric\"><label>已接入子系统</label><strong>8</strong><small>需规要求的八个底层系统</small></div><div class=\"metric\"><label>当前正常</label><strong>6</strong></div><div class=\"metric\"><label>需关注</label><strong>2</strong><small>延迟 1 · 离线 1</small></div></div><div class=\"topology-grid\"><svg class=\"topology-wires\" viewBox=\"0 0 1000 420\" preserveAspectRatio=\"none\" aria-hidden=\"true\">${[50,157,263,370].map(y=>`<line x1=\"500\" y1=\"210\" x2=\"300\" y2=\"${y}\"/><line x1=\"500\" y1=\"210\" x2=\"700\" y2=\"${y}\"/>`).join('')}</svg>${data.slice(0,4).map((r,i)=>node(r,i,1)).join('')}<div class=\"hub-grid\"><strong>关键数据中台</strong><span class=\"status\">连接正常</span></div>${data.slice(4).map((r,i)=>node(r,i+4,3)).join('')}</div></div>`}},
 {id:'rules',seq:196,group:'AI分析与智能分发',name:'复合订阅规则引擎搭建',desc:'选择子系统消息来源和消息类型，并组合条件配置门户订阅。',body:()=>`<div class="section"><div class="rule-group"><h2 class="section-title">订阅来源</h2><div class="source-grid"><div class="field"><label for="sourceSubsystem">来源子系统</label><select class="control full" id="sourceSubsystem"><option value="">请选择子系统</option>${'ABCDEFGH'.split('').map(x=>`<option>业务系统 ${x}</option>`).join('')}</select></div><div class="field"><label for="sourceEvent">消息类型</label><select class="control full" id="sourceEvent" disabled><option value="">请先选择子系统</option><option>消息类型示例一</option><option>消息类型示例二</option></select><small>示意选项；生产选项由所选子系统接入登记的消息类型提供。</small></div></div><div class="divider"></div><h2 class="section-title">消息筛选条件</h2><div class="row"><strong>条件组关系</strong><select class="control" aria-label="组内关系"><option>且</option><option>或</option></select><span class="subtle">组间关系</span><select class="control" aria-label="组间关系"><option>或</option><option>且</option></select><span class="subtle">拖动条件行可调整顺序</span></div><div class="condition"><span class="condition-label">条件 A</span><select aria-label="条件A字段"><option>选择字段</option><option>字段示例一</option><option>字段示例二</option></select><select aria-label="条件A关系"><option>包含</option><option>等于</option></select><input aria-label="条件A内容" placeholder="输入条件值"></div><div class="condition"><span class="condition-label">条件 B</span><select aria-label="条件B字段"><option>选择字段</option><option>字段示例一</option><option>字段示例二</option></select><select aria-label="条件B关系"><option>包含</option><option>等于</option></select><input aria-label="条件B内容" placeholder="输入条件值"></div><div class="condition"><span class="condition-label">条件 C</span><select aria-label="条件C字段"><option>选择字段</option><option>字段示例一</option><option>字段示例二</option></select><select aria-label="条件C关系"><option>包含</option><option>等于</option></select><input aria-label="条件C内容" placeholder="输入条件值"></div><div class="divider"></div><div class="row between"><div><strong>命中后的接收位置</strong><p class="subtle" style="margin:4px 0 0">门户消息中心 · 当前登录用户订阅流</p></div><div class="row"><button class="btn" data-action="condition">添加条件</button><button class="btn primary" data-action="save">保存订阅规则</button></div></div><div id="ruleResult" class="notice" hidden style="margin-top:16px"></div></div></div>`},
 {id:'collect',seq:207,group:'AI分析与智能分发',name:'创新需求与情报主动征集窗口',desc:'提交技术动态线索或监控盲区。',body:()=>`<div class="section" style="max-width:760px"><div class="form-grid"><div class="field full-row"><label for="kind">提报内容</label><select class="control full" id="kind"><option>技术动态线索</option><option>监控盲区</option></select></div><div class="field full-row"><label for="clue">线索描述</label><textarea class="control full" id="clue" placeholder="填写需要关注的技术动态或当前监控盲区"></textarea></div><div class="row end full-row"><button class="btn primary" data-action="submit">提交线索</button></div></div></div></div>`},
 {id:'workflow',seq:212,group:'AI分析与智能分发',name:'创新情报内部定向批示流转',desc:'将重要情报在工作台内流转批示。',body:()=>`<div class="section"><div class="table-wrap"><table><thead><tr><th>情报标题</th><th>重要程度</th><th>流转状态</th><th>操作</th></tr></thead><tbody><tr><td>重点情报示例 A</td><td>重要</td><td><span class="status warn">待批示</span></td><td><button class="link" data-action="circulate">发起批示</button></td></tr><tr><td>重点情报示例 B</td><td>重要</td><td><span class="status">流转中</span></td><td><button class="link" data-action="viewFlow">查看流转</button></td></tr></tbody></table></div></div>`},
 {id:'threshold',seq:215,group:'AI分析与智能分发',name:'AI分发置信度动态阈值管控',desc:'调整模型触发分发的置信度阈值。',body:()=>`<div class="section" style="max-width:680px"><div class="field"><label for="thresholdRange">分发置信度阈值</label><div class="row"><input class="slider" id="thresholdRange" type="range" min="0" max="100" value="85" aria-label="分发置信度阈值"><strong id="thresholdValue">85%</strong></div><small>低于该阈值的识别结果不触发自动分发。</small></div><div id="thresholdExamples" class="section"><h2 class="section-title">阈值判断示例</h2><div class="row"><span class="status sample-score" data-score="92">识别分数 92% · 自动分发</span><span class="status warn sample-score" data-score="71">识别分数 71% · 不触发自动分发</span></div><p class="subtle">示意分数仅用于说明阈值判断方式。</p></div><div class="row end" style="margin-top:24px"><button class="btn primary" data-action="save">保存阈值</button></div></div>`},
 {id:'heatmap',seq:216,group:'AI分析与智能分发',name:'创新主体跨域偏好关联挖掘',desc:'查看不同用户群关注点重合度形成的产业热力图。',body:()=>`<div class="section"><h2 class="section-title">用户群关注重合度</h2><div class="heatmap" role="img" aria-label="用户群与产业方向关注重合度热力图"><div class="axis"></div><div class="axis">方向一</div><div class="axis">方向二</div><div class="axis">方向三</div><div class="axis">用户群 A</div><div class="h3">高</div><div class="h1">低</div><div class="h2">中</div><div class="axis">用户群 B</div><div class="h2">中</div><div class="h4">高</div><div class="h1">低</div><div class="axis">用户群 C</div><div class="h1">低</div><div class="h3">高</div><div class="h2">中</div></div><p class="subtle">数据为结构示意，实际用户群和产业方向由业务数据提供。</p></div>`},
 {id:'trace',seq:217,group:'AI分析与智能分发',name:'模型分发路径可视化追踪地图',desc:'查看分发结果命中的规则与算法解释。',body:()=>`<div class="section"><div class="field" style="max-width:460px"><label for="traceRecord">分发记录</label><select id="traceRecord" class="control full"><option>分发记录示例 A</option><option>分发记录示例 B</option></select></div><div class="divider"></div><div class="split"><div><h2 class="section-title">处理路径</h2><div class="timeline"><div class="event"><strong>情报进入</strong><p>分发记录示例 A</p></div><div class="event"><strong>规则命中</strong><p>规则示例 A</p></div><div class="event"><strong>算法识别</strong><p>算法解释示例 A</p></div><div class="event"><strong>分发结果</strong><p>触达结果示例 A</p></div></div></div><div><h2 class="section-title">命中说明</h2><div class="block">此处展示该结果命中的规则和算法依据。</div></div></div></div>`},
 {id:'annotation',seq:218,group:'AI分析与智能分发',name:'专家标注纠正与批量审核',desc:'纠正打标错误并批量审核标注结果。',body:()=>`<div class="section"><div class="row between" style="margin-bottom:8px"><span class="subtle">待审核标注</span><span id="annotationCount" class="subtle">已选择 0 条</span></div><div class="table-wrap"><table><thead><tr><th style="width:52px"><input class="checkbox select-all" type="checkbox" aria-label="全选"></th><th>情报内容</th><th>当前标签</th><th>纠正标签</th><th>审核状态</th></tr></thead><tbody>${[['情报示例 A','标签示例一'],['情报示例 B','标签示例二'],['情报示例 C','标签示例三']].map((r,i)=>`<tr><td><input class="checkbox row-check" type="checkbox" aria-label="选择第${i+1}条"></td><td>${r[0]}</td><td>${r[1]}</td><td><input class="control" value="${r[1]}" aria-label="纠正标签"></td><td><span class="status warn">待审核</span></td></tr>`).join('')}</tbody></table></div><div id="annotationResult" class="notice" hidden style="margin-top:16px" aria-live="polite"></div><div class="row end" style="margin-top:16px"><button class="btn primary" data-action="review">提交审核</button></div></div>`},
 {id:'inbox',seq:221,group:'消息推送与前端展示',name:'内部工作台站内信与弹窗',desc:'展示站内信红点、弹窗提醒和跑马灯强提醒。',body:()=>`<div class="section"><h2 class="section-title">工作台提醒</h2><div class="row"><button class="bell" aria-label="站内信，1条未读"><span>站内信</span><i class="red-dot"></i></button><span class="subtle">未读提醒</span></div><div class="marquee" aria-label="滚动提醒"><span class="marquee-text">重点情报提醒：有新的重要情报待查看。</span></div><div class="popup-sample"><strong>重要情报提醒</strong><div class="subtle">有一条重要情报已送达，请及时查看。</div><div class="row end" style="margin-top:12px"><button class="btn primary" data-action="openIntel">查看情报</button></div></div></div>`},
 {id:'overview',seq:228,group:'消息推送与前端展示',name:'情报工作台概览数字大盘',desc:'汇总当日订阅命中、高危预警和个人效能统计。',body:()=>`<div class="section"><div class="metrics"><div class="metric"><label>当日订阅命中数</label><strong>128</strong></div><div class="metric"><label>高危预警</label><strong>6</strong></div><div class="metric"><label>个人效能统计</label><strong>—</strong><small>示意值待接入统计口径</small></div></div></div>`},
 {id:'feed',seq:229,group:'消息推送与前端展示',name:'多维情报卡片瀑布流列表',desc:'按时间或紧急度排序，并按维度筛查情报。',body:()=>`<div class="section"><div class="filterbar"><select class="control" id="feedSort" aria-label="排序方式"><option value="time">按时间排序</option><option value="priority">按紧急度排序</option></select><select class="control" id="feedCategory" aria-label="分类筛查"><option value="all">全部分类</option><option value="分类示例一">分类示例一</option><option value="分类示例二">分类示例二</option></select></div><div id="feedList">${[['重要情报示例 A','重要','10:42','分类示例一'],['情报示例 B','一般','10:18','分类示例二'],['情报示例 C','一般','09:56','分类示例一']].map(r=>`<article class="feed-item" data-priority="${r[1]==='重要'?1:2}" data-time="${r[2]}" data-category="${r[3]}"><div class="row between"><strong class="feed-title">${r[0]}</strong><span class="status ${r[1]==='重要'?'warn':''}">${r[1]}</span></div><div class="feed-meta">${r[2]} · ${r[3]}</div></article>`).join('')}</div></div>`},
 {id:'timeline',seq:230,group:'消息推送与前端展示',name:'事件演变时间线(Timeline)',desc:'按时间串联重点企业或技术的历史动态。',body:()=>`<div class="section"><div class="field" style="max-width:440px"><label for="timelineTarget">重点对象</label><select class="control full" id="timelineTarget"><option>对象示例：技术方向 A</option><option>对象示例：企业 B</option></select></div><div class="divider"></div><div class="timeline"><div class="event"><time>10:30</time><strong>动态更新示例 A</strong></div><div class="event"><time>09:10</time><strong>动态更新示例 B</strong></div><div class="event"><time>昨天 16:20</time><strong>历史动态示例 C</strong></div></div></div>`},
 {id:'drill',seq:231,group:'消息推送与前端展示',name:'异动溯源与详情下钻面板',desc:'查看原始指标、变更前后差值和相关趋势。',body:()=>`<div class="section"><h2 class="section-title">异动示例：指标发生变化</h2><div class="metrics"><div class="metric"><label>原始指标</label><strong>指标示例</strong></div><div class="metric"><label>变化前</label><strong>120</strong></div><div class="metric"><label>变化后 / 差值</label><strong>156　(+36)</strong></div></div><div class="divider"></div><h2 class="section-title">相关趋势</h2><svg class="mini-line" viewBox="0 0 640 112" role="img" aria-label="指标变化趋势示意"><polyline points="4,88 90,76 176,80 262,55 348,64 434,38 520,44 636,18"/></svg></div>`},
 {id:'search',seq:232,group:'消息推送与前端展示',name:'历史情报毫秒级全文检索',desc:'搜索历史已推送情报并高亮命中关键词。',body:()=>`<div class="section"><div class="filterbar"><input class="control wide" id="searchText" value="关键词示例" aria-label="搜索历史情报"><button class="btn primary" data-action="search">搜索</button></div><div id="searchResults">${[['历史情报示例 A','政策服务系统','10:42'],['历史情报示例 B','科技企业系统','昨天 16:20']].map(r=>`<div class="feed-item"><strong>${r[0]}</strong><div class="feed-meta">来源：${r[1]} · ${r[2]}</div><p>正文片段包含 <span class="highlight">关键词示例</span>，用于演示命中词高亮。</p></div>`).join('')}</div></div>`},
 {id:'batch',seq:233,group:'消息推送与前端展示',name:'快捷批处理与核心收藏夹',desc:'批量标为已读、跨应用分享并收藏高优情报。',body:()=>`<div class="section"><div class="row between" style="margin-bottom:8px"><span id="selectedCount" class="subtle">已选择 0 条</span><div class="row"><button class="btn" data-action="read">标为已读</button><button class="btn" data-action="share">跨应用分享</button><button class="btn" data-action="favorite">收藏</button></div></div><div id="batchResult" class="notice" hidden style="margin-bottom:16px" aria-live="polite"></div><div class="table-wrap"><table><thead><tr><th style="width:52px"><input class="checkbox select-all" type="checkbox" aria-label="全选情报"></th><th>情报</th><th>紧急度</th><th>状态</th><th>收藏</th></tr></thead><tbody>${[['情报示例 A','高','未读','☆'],['情报示例 B','一般','未读','☆'],['情报示例 C','高','已读','★']].map((r,i)=>`<tr><td><input class="checkbox batch-check row-check" type="checkbox" aria-label="选择${r[0]}"></td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div>`},
 {id:'quiet',seq:234,group:'消息推送与前端展示',name:'多端免打扰与休眠期设置',desc:'设置静默时段；静默期间仅放行 S 级严重异动预警。',body:()=>`<div class="section" style="max-width:520px"><div class="field"><label for="quietToggle">免打扰</label><div class="row"><input class="checkbox" id="quietToggle" type="checkbox" checked><span>启用静默时段</span></div></div><div class="form-grid" style="margin-top:16px"><div class="field"><label for="quietStart">开始时间</label><input class="control" id="quietStart" type="time"></div><div class="field"><label for="quietEnd">结束时间</label><input class="control" id="quietEnd" type="time"></div></div><div class="notice" style="margin-top:16px">静默期间仅放行 S 级严重异动预警。</div><div class="row end" style="margin-top:24px"><button class="btn primary" data-action="save">保存设置</button></div></div>`},
 {id:'monitor',seq:237,group:'消息推送与前端展示',name:'运维级全局效能与监控大屏',desc:'查看消息触达率、延迟和各推送通道健康度。',body:()=>`<div class="section"><div class="metrics"><div class="metric"><label>消息触达率</label><strong>96.8%</strong></div><div class="metric"><label>消息延迟</label><strong>286 ms</strong></div><div class="metric"><label>通道健康度</label><strong>3 / 4</strong></div></div><div class="table-wrap"><table><thead><tr><th>推送通道</th><th>健康状态</th></tr></thead><tbody>${[['站内信','正常'],['短信','正常'],['邮件','异常'],['协同办公软件','正常']].map(r=>`<tr><td>${r[0]}</td><td><span class="status ${r[1]==='异常'?'error':''}">${r[1]}</span></td></tr>`).join('')}</tbody></table></div></div>`},
 {id:'broadcast',seq:238,group:'消息推送与前端展示',name:'运维级全量广播与干预后台',desc:'发布全局紧急公告或撤回错误发送的情报。',body:()=>`<div class="section"><h2 class="section-title">全量广播</h2><div class="field" style="max-width:760px"><label for="announcement">紧急公告内容</label><textarea class="control full" id="announcement" placeholder="填写需要向全体用户发布的公告"></textarea><div class="row end"><button class="btn primary" data-action="broadcast">发布全量广播</button></div></div><div class="divider"></div><h2 class="section-title">已发送情报</h2><div class="table-wrap"><table><thead><tr><th>情报</th><th>发送状态</th><th>操作</th></tr></thead><tbody><tr><td>已发送情报示例 A</td><td><span class="status">已发送</span></td><td><button class="link danger-link" data-action="retract">撤回</button></td></tr><tr><td>已发送情报示例 B</td><td><span class="status">已发送</span></td><td><button class="link danger-link" data-action="retract">撤回</button></td></tr></tbody></table></div></div>`}
];
const requirementMeta={"176":{"name":"底层接入状态雷达拓扑图","requirement":"可视化实时展示八个业务系统与中台的连接健康度及心跳状态","purpose":"门户消息组件集成到各底层系统后，由系统持续报告自身及组件运行状态；门户据此判断该接入点是否仍健康、是否能继续向门户送消息。","flow":"子系统集成门户消息组件 → 组件按周期上报系统/组件健康状态 → 门户校验来源并记录最近心跳 → 监测器按最近上报时间更新拓扑节点状态 → 运维人员查看异常系统。状态由子系统报告，门户展示报告结果与心跳是否过期。","devSuggestion":"推荐使用 HTTPS + JSON 心跳上报接口（例如 POST /api/portal-message/v1/heartbeat），组件携带 systemId、componentId、上报时间、健康状态和组件版本。认证沿用消息上报接口既有鉴权/验签规范（对应序号 164）。门户按配置的心跳周期和超时阈值判断正常、延迟、离线；例如 30 秒上报一次、连续 3 个周期未收到时判离线，具体值由部署环境配置。"},"196":{"name":"复合订阅规则引擎搭建","requirement":"提供可视化拖拽表单，支持构建(条件A且条件B)或C的复杂规则","purpose":"门户管理员选择要订阅的子系统和消息类型，再组合条件，决定哪些子系统消息进入门户订阅消息流。","flow":"管理员选来源子系统 → 选该系统已接入的消息类型 → 配置字段条件及且/或关系 → 保存订阅规则 → 子系统消息到达门户后按来源、类型和条件匹配 → 命中消息进入门户消息订阅流。","devSuggestion":"消息组件统一事件字段至少包含 systemId、eventType、messageId、occurredAt 和 payload。订阅规则用 systemId/eventType 确定来源与消息类型，再对已登记的 payload 字段做条件匹配；保存规则后由消息接入流程执行匹配，命中后进入门户消息中心。"},"207":{"name":"创新需求与情报主动征集窗口","requirement":"面向主体开放提报入口，搜集基层缺乏的技术动态线索与监控盲区","purpose":"门户用户提交当前缺少的技术动态线索或监控盲区，补充后续可关注的消息来源与主题。","flow":"用户选择“技术动态线索”或“监控盲区” → 填写描述并提交 → 门户记录提报内容并显示提交结果，供后续业务人员查看。","devSuggestion":"使用门户现有登录态提交 HTTPS 表单接口，保存提报类型、描述、提交人和时间即可；本需求范围内只需完成收集与提交反馈。"},"212":{"name":"创新情报内部定向批示流转","requirement":"支持将重要情报在工作台内进行流转批示，打通情报到决策的闭环","purpose":"将门户收到的重要消息转给指定内部对象并附上批示，保留流转状态，支持从消息发现到内部处理。","flow":"从待处理重要消息发起批示 → 指定内部流转对象并填写批示内容 → 提交后状态变为流转中 → 工作台可回看该消息的流转记录。","devSuggestion":"复用门户工作台身份和站内任务流转能力，以消息 ID 关联批示记录，保留发起人、接收人、批示内容及状态，避免复制一份情报正文。"},"215":{"name":"AI分发置信度动态阈值管控","requirement":"允许运营人工微调模型触发下发的分数线，平衡宁漏勿错与宁错勿漏","purpose":"运营人员调整 AI 识别结果进入自动消息分发的最低置信度分数线，控制自动推送的范围。","flow":"AI 为消息给出置信度分数 → 分发前与运营设置的阈值比较 → 达到或超过阈值的消息进入自动分发，低于阈值的不自动分发 → 页面即时演示阈值变化对样例消息的影响。","devSuggestion":"阈值作为分发策略配置集中保存并留有更新时间；在消息路由前统一比较置信度，页面展示的样例仅用于说明边界，不代表线上实际模型结果。"},"216":{"name":"创新主体跨域偏好关联挖掘","requirement":"分析不同用户群关注点的重合度，为宏观战略部门提供产业热力图","purpose":"从用户群对不同产业主题的消息关注情况中查看交叉重合，帮助宏观战略人员识别共同关注方向。","flow":"门户汇总已形成的用户群与产业主题关注数据 → 计算关注重合度 → 页面以矩阵热力图展示群体和主题之间的高、中、低关联。","devSuggestion":"按用户群和产业主题聚合订阅与关注统计，再生成矩阵数据；热力图仅展示聚合结果，避免将其误读为单条消息分发规则。"},"217":{"name":"模型分发路径可视化追踪地图","requirement":"对最终落地的分发结果提供“命中哪些规则与算法”的白盒化解释","purpose":"根据一条门户分发消息回看它从子系统上报、规则命中、AI 判断到推送结果的路径，解释消息为何到达。","flow":"子系统消息进入门户 → 订阅规则匹配 → AI 识别与置信度判定 → 路由选择并发送 → 渠道回执更新结果；页面用同一条分发记录串起各节点及命中依据。","devSuggestion":"为消息生成贯穿接入、匹配、识别、路由和渠道回执的 traceId；各处理节点记录时间、规则/模型标识及结果，页面按 traceId 查询链路。"},"218":{"name":"专家人工干预与离线标注重镇","requirement":"为平台运营与情报专家提供快速纠正打标错误、批量审核的后台","purpose":"运营或情报专家修正错误标签并提交审核，避免错误标签持续影响订阅命中和消息分发。","flow":"运营人员查看待审核消息和当前标签 → 修改纠正标签 → 勾选一条或多条记录并提交审核 → 页面更新审核状态并显示本次处理数量。","devSuggestion":"审核提交保存原标签、纠正标签、审核人及审核时间；审核后的标签作为后续模型/规则使用的有效标签，原型只展示审核闭环。"},"221":{"name":"内部工作台站内信与弹窗","requirement":"系统内的强提醒能力，包括红点角标、右下角弹窗及跑马灯","purpose":"门户消息组件把已订阅消息呈现在工作台站内信、重要提醒弹窗和跑马灯中，让用户及时看到消息。","flow":"门户消息到达工作台 → 消息组件更新站内信未读提示 → 对重要消息展示弹窗与跑马灯 → 用户打开提醒查看消息。","devSuggestion":"工作台前端通过门户现有消息推送连接接收消息；若尚无单向推送通道，可采用 SSE，复用同一消息 ID 更新站内信、弹窗和跑马灯，避免三套独立消息源。"},"228":{"name":"情报工作台概览数字大盘","requirement":"用户首页，汇总当日订阅命中数、高危预警及个人效能统计","purpose":"在消息工作台汇总个人收到的订阅消息、高危提醒和处理效能，帮助用户快速了解待关注情况。","flow":"门户统计当前用户当日订阅命中数、高危预警数和个人效能指标 → 页面在工作台概览中并列呈现；统计口径未接入时明确显示待接入。","devSuggestion":"复用消息记录与渠道回执聚合统计；明确“命中”“高危”和“个人效能”的统计口径后按当前用户和自然日查询，避免用固定示意值替代实际指标。"},"229":{"name":"多维情报卡片瀑布流列表","requirement":"支持按时间线、紧急度排序及多维度分类筛查的动态展示流","purpose":"以消息流呈现子系统订阅命中的消息，支持按时间或紧急度排序及分类筛查。","flow":"订阅规则命中并生成门户消息 → 消息进入展示流 → 用户切换时间/紧急度排序或分类 → 列表按所选条件更新。","devSuggestion":"统一消息列表查询支持时间/紧急度排序和分类筛选，卡片展示消息标题、紧急度、时间及类别；点击消息沿用序号 231 的详情入口。"},"230":{"name":"事件演变时间线(Timeline)","requirement":"以时间轴串联某个重点企业或技术的历史演变全周期动态","purpose":"以主体或技术为线索，把门户收到的相关消息按时间串联，查看其历史演变。","flow":"门户按主体或技术关联消息 → 用户选择关注对象 → 时间线加载其近期及历史消息 → 用户顺序查看事件变化。","devSuggestion":"消息接入时保留主体/技术实体标识及发生时间；时间线按实体 ID 聚合消息并按发生时间排序，避免仅按标题文本拼接。"},"231":{"name":"异动溯源与详情下钻面板","requirement":"点击情报卡片可查看异动原始指标、前后对比差值及相关趋势图","purpose":"从一条异动消息进入详情，查看原始指标、变化前后数值、差值和相关趋势。","flow":"用户从异动消息打开详情 → 页面读取原始指标和前后快照 → 计算并展示差值 → 展示相关趋势帮助判断变化。","devSuggestion":"消息详情接口以 messageId 返回原始指标、变更前后值及趋势序列；差值由同一指标的前后值计算，页面不另造分析结论。"},"232":{"name":"历史情报毫秒级全文检索","requirement":"基于ES引擎提供对过往所有已推送历史情报的关键字高亮搜索","purpose":"在门户已推送消息历史中检索关键词，并在匹配消息正文中突出命中词。","flow":"已推送消息进入历史索引 → 用户输入关键词搜索 → 页面返回命中消息及来源、时间 → 正文片段高亮关键词；无结果时保留查询条件并显示空态。","devSuggestion":"对已推送消息建立全文索引，保留消息 ID、正文、来源和推送时间；检索服务返回命中片段及高亮位置，索引延迟以实际部署指标验收。"},"233":{"name":"快捷批处理与核心收藏夹","requirement":"提供一键标为已读、跨应用快捷分享以及高优情报打星收藏功能","purpose":"对门户消息执行已读、收藏和跨应用分享，批量处理后在列表中直接反映状态。","flow":"用户勾选一条或多条消息 → 选择标已读、收藏或分享 → 已读/收藏状态更新到列表；分享先汇总所选消息供确认。","devSuggestion":"读状态按用户与消息 ID 维护，收藏关联用户与消息；批量操作提交所选 ID 集合。跨应用分享调用门户已有分享能力，避免由原型页面直接向外部系统发送。"},"234":{"name":"多端免打扰与休眠期设置","requirement":"允许个人设置静默时间段，该时段内仅放行S级严重异动预警","purpose":"为个人设置消息免打扰时段；该时段普通消息不触发打扰，S 级严重异动预警仍放行。","flow":"用户开启免打扰并设置起止时间 → 门户发送消息前检查个人静默配置 → 静默时段抑制普通提醒、继续放行 S 级预警 → 保存后页面反馈当前配置。","devSuggestion":"静默配置按用户保存起止时间和启用状态；在发送通道前统一执行时段判断，S 级严重异动走明确的强制放行分支。"},"237":{"name":"运维级全局效能与监控大屏","requirement":"管理员视角下的系统消息触达率、延迟毫秒数及通道健康度看板","purpose":"管理员查看门户消息各发送通道的触达率、处理延迟和通道健康状态，定位推送异常。","flow":"发送通道产生送达回执和耗时 → 门户统一汇总触达率、延迟和通道健康 → 管理员在大屏查看总体指标及逐通道状态。","devSuggestion":"各推送通道统一上报发送尝试、成功/失败回执和时间戳；按相同时间窗口计算触达率与延迟，并在看板同时保留逐通道状态，方便定位异常。"},"238":{"name":"运维级全量广播与干预后台","requirement":"允许管理员手动插播全局紧急公告，或一键撤回已错发的情报","purpose":"管理员向门户消息接收范围发布全量紧急公告，并可撤回误发的门户消息。","flow":"管理员填写并发布全量公告 → 消息进入门户广播列表 → 发现错发时按消息执行撤回 → 列表更新为已撤回状态。","devSuggestion":"广播与撤回均按消息 ID 操作，后台保存发布/撤回状态和操作时间；发布、撤回接口校验管理员权限，撤回操作确认后更新消息状态。"}};
const nav=document.getElementById('navigation'),page=document.getElementById('page'),toast=document.getElementById('toast'),drawer=document.getElementById('drawer'),drawerMask=document.getElementById('drawerMask');let current='topology',reviewMode=false;
const groups=[...new Set(pages.map(p=>p.group))];
nav.innerHTML=groups.map((g,i)=>`<section class="group"><button class="group-name" aria-expanded="true"><span class="group-icon">${['⌂','◈','◇'][i]}</span>${g}<span class="group-arrow">⌄</span></button><div class="group-items">${pages.filter(p=>p.group===g).map(p=>`<button class="nav-item" data-page="${p.id}" data-short="${p.name.slice(0,2)}" title="${p.name}">${p.name}</button>`).join('')}</div></section>`).join('');
function openPage(id){current=id;const p=pages.find(x=>x.id===id);document.querySelectorAll('.nav-item').forEach(n=>{const active=n.dataset.page===id;n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});page.innerHTML=`<header class="page-head"><div><h1>${p.name}</h1><p>${p.desc}</p></div><span class="source-id">需规序号 ${p.seq}</span></header><section class="review-panel" id="reviewPanel" hidden><h2>功能评审说明</h2><div class="review-grid"><div><span class="review-label">对应需规 · 序号 ${p.seq}</span><strong>${requirementMeta[p.seq].name}</strong><p>${requirementMeta[p.seq].requirement}</p></div><div><span class="review-label">功能说明</span><p>${requirementMeta[p.seq].purpose}</p></div><div><span class="review-label">业务流程与页面响应</span><p>${requirementMeta[p.seq].flow}</p></div><div><span class="review-label">开发实现建议</span><p>${requirementMeta[p.seq].devSuggestion}</p></div></div></section>${p.body()}`;document.getElementById('reviewPanel').hidden=!reviewMode;bindPage();document.querySelector('.main').scrollTop=0;}
function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000)}
function closeDrawer(){drawer.classList.remove('open');drawerMask.classList.remove('open')}
function bindPage(){
 document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{const data=[['业务系统 A','正常','10:46:21','10:46:20','38 ms','0'],['业务系统 B','正常','10:46:20','10:46:18','62 ms','0'],['业务系统 C','延迟','10:45:10','10:41:52','428 ms','2'],['业务系统 D','正常','10:46:19','10:46:16','51 ms','0'],['业务系统 E','离线','10:40:12','10:33:04','—','6'],['业务系统 F','正常','10:46:17','10:46:15','73 ms','0'],['业务系统 G','正常','10:46:16','10:46:14','95 ms','0'],['业务系统 H','正常','10:46:15','10:46:12','66 ms','0']][Number(b.dataset.node)];drawer.innerHTML=`<div class=\"drawer-head\"><h2>${data[0]} · 接入详情</h2><button class=\"close\" aria-label=\"关闭\">×</button></div><div class=\"section\"><span class=\"status ${data[1]==='离线'?'error':data[1]==='延迟'?'warn':''}\">连接${data[1]}</span></div><div class=\"section\"><div class=\"table-wrap\"><table><tbody>${['连接状态','心跳','最近成功采集','延迟','异常数'].map((label,i)=>`<tr><th>${label}</th><td>${data[i+1]}</td></tr>`).join('')}</tbody></table></div></div><div class=\"section\"><h3 class=\"section-title\">异常记录</h3>${Number(data[5])>0?`<div class=\"notice\">存在 ${data[5]} 条接入异常，采集任务可重新执行。</div><div class=\"row end\" style=\"margin-top:16px\"><button class=\"btn primary\" data-action=\"retry\">重试采集</button></div>`:'<div class=\"empty\">暂无异常记录</div>'}</div>`;drawer.classList.add('open');drawerMask.classList.add('open');drawer.querySelector('.close').onclick=closeDrawer;drawer.querySelector('[data-action=\"retry\"]')?.addEventListener('click',()=>{closeDrawer();showToast('已提交采集重试（原型演示）')})});
 const slider=document.getElementById('thresholdRange');slider?.addEventListener('input',()=>{document.getElementById('thresholdValue').textContent=slider.value+'%';document.querySelectorAll('.sample-score').forEach(el=>{const send=Number(el.dataset.score)>=Number(slider.value);el.classList.toggle('warn',!send);el.textContent=`识别分数 ${el.dataset.score}% · ${send?'自动分发':'不触发自动分发'}`})});
 const sourceSubsystem=document.getElementById('sourceSubsystem'),sourceEvent=document.getElementById('sourceEvent');sourceSubsystem?.addEventListener('change',()=>{sourceEvent.disabled=!sourceSubsystem.value;sourceEvent.innerHTML=sourceSubsystem.value?'<option value="">请选择消息类型</option><option>消息类型示例一</option><option>消息类型示例二</option>':'<option value="">请先选择子系统</option>'});
 const feedList=document.getElementById('feedList'),feedSort=document.getElementById('feedSort'),feedCategory=document.getElementById('feedCategory');
 const refreshFeed=()=>{if(!feedList)return;const items=[...feedList.querySelectorAll('.feed-item')];items.sort((a,b)=>feedSort.value==='priority'?Number(a.dataset.priority)-Number(b.dataset.priority):b.dataset.time.localeCompare(a.dataset.time));items.forEach(item=>{item.hidden=feedCategory.value!=='all'&&item.dataset.category!==feedCategory.value;feedList.append(item)})};
 feedSort?.addEventListener('change',refreshFeed);feedCategory?.addEventListener('change',refreshFeed);
 const target=document.getElementById('timelineTarget');target?.addEventListener('change',()=>{const isTech=target.selectedIndex===0;const labels=isTech?['技术方向 A 发布新进展','相关技术成果进入应用验证','形成早期技术布局']:['企业 B 发布经营动态','企业 B 完成业务调整','企业 B 首次进入重点监测'];document.querySelectorAll('#timelineTarget~.divider~.timeline .event strong').forEach((el,i)=>el.textContent=labels[i])});
 const traceRecord=document.getElementById('traceRecord');traceRecord?.addEventListener('change',()=>{const idx=traceRecord.selectedIndex+1;const texts=[`分发记录示例 ${idx}`,`命中规则示例 ${idx}`,`算法识别依据示例 ${idx}`,`触达结果示例 ${idx}`];document.querySelectorAll('.timeline .event p').forEach((el,i)=>el.textContent=texts[i])});
 const quietToggle=document.getElementById('quietToggle');quietToggle?.addEventListener('change',()=>{['quietStart','quietEnd'].forEach(id=>document.getElementById(id).disabled=!quietToggle.checked)});
 const updateSelection=()=>{const checks=[...document.querySelectorAll('.row-check')],selected=checks.filter(c=>c.checked).length;const batchCount=document.getElementById('selectedCount'),annotationCount=document.getElementById('annotationCount');if(batchCount)batchCount.textContent=`已选择 ${selected} 条`;if(annotationCount)annotationCount.textContent=`已选择 ${selected} 条`;const master=document.querySelector('.select-all');if(master){master.checked=checks.length>0&&selected===checks.length;master.indeterminate=selected>0&&selected<checks.length}};
 document.querySelectorAll('.condition').forEach(el=>{el.draggable=true;el.addEventListener('dragstart',()=>el.classList.add('dragging'));el.addEventListener('dragend',()=>el.classList.remove('dragging'));el.addEventListener('dragover',e=>{e.preventDefault();const moving=document.querySelector('.condition.dragging');if(moving&&moving!==el){const box=el.getBoundingClientRect();groupInsert(el,moving,e.clientY>box.top+box.height/2)}})});
 const groupInsert=(target,moving,after)=>target.parentNode.insertBefore(moving,after?target.nextSibling:target);
 document.querySelectorAll('.row-check').forEach(c=>c.addEventListener('change',updateSelection));
 document.querySelector('.select-all')?.addEventListener('change',e=>{document.querySelectorAll('.row-check').forEach(c=>c.checked=e.target.checked);updateSelection()});
 const selectedRows=()=>[...document.querySelectorAll('.row-check:checked')].map(c=>c.closest('tr'));
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.action;
  if(a==='viewFlow'){drawer.innerHTML=`<div class="drawer-head"><h2>流转记录</h2><button class="close" aria-label="关闭">×</button></div><p>重点情报示例 B</p><div class="timeline"><div class="event"><time>10:30</time><strong>发起批示</strong><p>流转对象：示意用户</p></div><div class="event"><time>10:42</time><strong>流转中</strong></div></div>`;drawer.classList.add('open');drawerMask.classList.add('open');drawer.querySelector('.close').onclick=closeDrawer;return}
  if(a==='circulate'){const row=b.closest('tr');drawer.innerHTML=`<div class="drawer-head"><h2>情报定向批示</h2><button class="close" aria-label="关闭">×</button></div><div class="field"><label for="recipient">流转对象</label><input class="control full" id="recipient" placeholder="输入流转对象"></div><div class="field" style="margin-top:16px"><label for="instruction">批示内容</label><textarea class="control full" id="instruction" placeholder="填写批示内容"></textarea></div><div class="row end" style="margin-top:24px"><button class="btn primary" data-action="sendFlow">提交流转</button></div>`;drawer.classList.add('open');drawerMask.classList.add('open');drawer.querySelector('.close').onclick=closeDrawer;drawer.querySelector('[data-action="sendFlow"]').onclick=()=>{const recipient=drawer.querySelector('#recipient'),instruction=drawer.querySelector('#instruction');if(!recipient.value.trim()||!instruction.value.trim()){showToast(!recipient.value.trim()?'请填写流转对象':'请填写批示内容');(!recipient.value.trim()?recipient:instruction).focus();return}row.cells[2].innerHTML='<span class="status">流转中</span>';closeDrawer();showToast('已提交流转（原型演示）')};return}
  if(a==='retract'){if(!confirm('确认撤回这条已发送情报？'))return;b.closest('tr').cells[1].innerHTML='<span class="status warn">已撤回</span>';showToast('情报已撤回（原型演示）');return}
  if(a==='condition'){const group=document.querySelector('.rule-group'),n=group.querySelectorAll('.condition').length+1,el=document.createElement('div');el.className='condition';el.innerHTML=`<span class="condition-label">条件 ${String.fromCharCode(64+n)}</span><select aria-label="新条件字段"><option>选择字段</option><option>字段示例一</option><option>字段示例二</option></select><select aria-label="新条件关系"><option>包含</option><option>等于</option></select><input aria-label="新条件内容" placeholder="输入条件值">`;group.insertBefore(el,group.lastElementChild);el.draggable=true;el.addEventListener('dragstart',()=>el.classList.add('dragging'));el.addEventListener('dragend',()=>el.classList.remove('dragging'));el.addEventListener('dragover',e=>{e.preventDefault();const moving=document.querySelector('.condition.dragging');if(moving&&moving!==el){const box=el.getBoundingClientRect();group.insertBefore(moving,e.clientY>box.top+box.height/2?el.nextSibling:el)}});return}
  if(a==='read'||a==='favorite'){const rows=selectedRows();if(!rows.length){showToast('请先选择情报');return}rows.forEach(row=>{if(a==='read')row.cells[3].textContent='已读';else row.cells[4].textContent='★'});const result=document.getElementById('batchResult');if(result){result.hidden=false;result.textContent=`已${a==='read'?'标记已读':'收藏'} ${rows.length} 条情报。`}return}
  if(a==='share'){const rows=selectedRows();if(!rows.length){showToast('请先选择情报');return}drawer.innerHTML=`<div class="drawer-head"><h2>跨应用分享</h2><button class="close" aria-label="关闭">×</button></div><p>待分享情报</p><ul>${rows.map(r=>`<li>${r.cells[1].textContent}</li>`).join('')}</ul><div class="notice">原型仅展示分享内容，不会向外部应用发送数据。</div><div class="row end" style="margin-top:24px"><button class="btn primary" data-action="confirmShare">确认分享</button></div>`;drawer.classList.add('open');drawerMask.classList.add('open');drawer.querySelector('.close').onclick=closeDrawer;drawer.querySelector('[data-action="confirmShare"]').onclick=()=>{closeDrawer();showToast('分享已完成（原型演示）')};return}
  if(a==='review'){const rows=selectedRows();if(!rows.length){showToast('请先选择待审核标注');return}rows.forEach(row=>row.cells[4].innerHTML='<span class="status">已审核</span>');const result=document.getElementById('annotationResult');result.hidden=false;result.textContent=`已审核 ${rows.length} 条标注。`;return}
  if(a==='broadcast'){const field=document.getElementById('announcement'),value=field.value.trim();if(!value){showToast('请先填写公告内容');return}const tbody=page.querySelector('table tbody'),tr=document.createElement('tr');tr.innerHTML=`<td>${value.replace(/[<>]/g,'')}</td><td><span class="status">已发送</span></td><td><button class="link danger-link" data-action="retract">撤回</button></td>`;tbody.prepend(tr);field.value='';tr.querySelector('[data-action="retract"]').onclick=()=>{if(confirm('确认撤回这条已发送情报？')){tr.cells[1].innerHTML='<span class="status warn">已撤回</span>';showToast('情报已撤回（原型演示）')}};showToast('全量广播已提交（原型演示）');return}
  if(a==='search'){const query=document.getElementById('searchText').value.trim().toLowerCase(),items=[...document.querySelectorAll('#searchResults .feed-item')];let count=0;items.forEach(item=>{const match=!query||item.textContent.toLowerCase().includes(query);item.hidden=!match;if(match)count++});let empty=document.querySelector('#searchResults .empty');if(!count&&!empty){empty=document.createElement('div');empty.className='empty';document.getElementById('searchResults').append(empty)}if(empty){empty.hidden=count>0;empty.textContent=query?`没有匹配“${query}”的历史情报，请修改关键词后重试。`:'暂无历史情报。'}return}
  if(a==='submit'){const clue=document.getElementById('clue');if(!clue.value.trim()){showToast('请填写线索描述');return}let result=document.getElementById('clueResult');if(!result){result=document.createElement('div');result.id='clueResult';result.className='notice';clue.closest('.form-grid').append(result)}result.textContent=`已收到“${document.getElementById('kind').value}”，内容：${clue.value.trim()}`;return}
  if(a==='openIntel'){drawer.innerHTML=`<div class="drawer-head"><h2>站内信</h2><button class="close" aria-label="关闭">×</button></div><div class="feed-item"><span class="status warn">重要提醒</span><p>有一条重要情报已送达，请及时查看。</p><span class="feed-meta">刚刚</span></div><div class="row end" style="margin-top:16px"><button class="btn" data-action="markInboxRead">标为已读</button></div>`;drawer.classList.add('open');drawerMask.classList.add('open');drawer.querySelector('.close').onclick=closeDrawer;drawer.querySelector('[data-action="markInboxRead"]').onclick=()=>{closeDrawer();showToast('提醒已标为已读（原型演示）')};return}
  if(a==='save'){if(current==='quiet'){const start=document.getElementById('quietStart').value,end=document.getElementById('quietEnd').value;if(quietToggle.checked&&(!start||!end)){showToast('请设置静默开始和结束时间');return}showToast(quietToggle.checked?`免打扰已保存：${start}–${end}，S级预警仍会放行`:'免打扰已关闭');return}if(current==='rules'){const source=document.getElementById('sourceSubsystem'),eventType=document.getElementById('sourceEvent'),conditions=[...document.querySelectorAll('.condition')];if(!source.value||!eventType.value){showToast('请先选择来源子系统和消息类型');return}if(conditions.some(c=>c.querySelector('select').selectedIndex===0)){showToast('请为每个条件选择字段');return}if(conditions.some(c=>!c.querySelector('input').value.trim())){showToast('请填写每个规则条件的值');return}const result=document.getElementById('ruleResult');result.hidden=false;result.textContent=`订阅规则已保存：${source.value} · ${eventType.value}；${conditions.length} 个筛选条件满足组内${document.querySelector('[aria-label="组内关系"]').value}、组间${document.querySelector('[aria-label="组间关系"]').value}后，命中消息进入门户消息中心。`;return}showToast('已保存（原型演示）');return}
  showToast('操作已完成（原型演示）');
 }));
}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)openPage(b.dataset.page);const g=e.target.closest('.group-name');if(g){const box=g.nextElementSibling;box.hidden=!box.hidden;g.setAttribute('aria-expanded',String(!box.hidden))}});document.getElementById('reviewToggle').addEventListener('click',e=>{reviewMode=!reviewMode;e.currentTarget.setAttribute('aria-pressed',String(reviewMode));e.currentTarget.textContent=`评审模式：${reviewMode?'开':'关'}`;const panel=document.getElementById('reviewPanel');if(panel)panel.hidden=!reviewMode});drawerMask.addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});openPage(current);
</script>
