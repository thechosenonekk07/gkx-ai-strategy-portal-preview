<script>

 {time:'00:00:24',speaker:'说话人 1',text:'其中 AI 技术和 GDP 数据需要保留英文缩写及标准计量单位。'}

let selectedPara=0,selectedVersion=10,downloadTimers={};
let historyVersions=Array.from({length:10},(_,i)=>({id:10-i,editor:i===0?'当前用户':(i%2?'张研究员':'自动保存'),time:`2026-10-24 10:${String(48-i*3).padStart(2,'0')}`,text:i===0?transcriptionParts.map(p=>p.text).join('\n'):(i===1?'本次调研重点是梳理低空经济领域的核心技术路线。\n请关注项目申报窗口变化。':'各部门需要加强数据收集并及时更新相关记录。')}));
let autosaveTimer=null;
let polishChoice='口语转书面',offlineSyncStatus='有 2 处本地编辑待同步';

function renderVocab(){return `<div class="notice">词条和转写规则按用户或业务空间维护；词库每库最多5000条，词条保存后供后续任务使用。</div><section class="section" id="semanticLibrary"><div class="row between"><h2 class="section-title">当前语义库</h2><span class="subtle"><b id="lexiconCount">${lexicon.length}</b>/5000 条</span></div><div class="row section"><label for="lexiconScope">归属空间</label><select class="control" id="lexiconScope" aria-label="词条归属空间"><option>当前用户</option><option>子系统 A</option><option>子系统 B</option></select><input class="control wide" id="lexiconInput" placeholder="输入行业词汇、常用句式或固定表述" aria-label="词条内容"><select class="control" id="lexiconKind" aria-label="词条类型"><option>行业词</option><option>常用句式</option><option>固定表述</option></select><button class="btn primary" data-action="addLexicon">添加词条</button></div><p class="subtle">表格中的词条可直接修改；离开输入框后保存。</p><div class="table-wrap"><table><thead><tr><th>类型</th><th>词条内容（可直接修改）</th><th>状态</th><th>操作</th></tr></thead><tbody id="lexiconRows"></tbody></table></div></section><section class="section" id="customRules"><div class="row between"><div><h2 class="section-title">自定义转写规则</h2><p class="subtle">固定词汇替换、句式格式化、敏感词过滤；按顺序作用于本次转写。</p></div><div class="row"><input type="file" id="ruleFile" hidden aria-label="选择转写规则文件"><button class="btn" data-action="importRules">批量导入</button><button class="btn primary" data-action="newRule">新增规则</button></div></div><div class="gkx-file-feedback" data-file-feedback="ruleFile" hidden></div><div class="table-wrap"><table><thead><tr><th>规则类型</th><th>规则内容</th><th>启用</th></tr></thead><tbody id="customRuleRows"></tbody></table></div></section>`}

function addHotwordFrom(id){const input=document.getElementById(id),value=input?.value.trim();if(!value){showToast('请先输入热词');return}if(hotwords.length>=50){showToast('当前任务最多添加50个热词');return}if(hotwords.includes(value)){showToast('该热词已在本次任务中');return}hotwords.push(value);input.value='';renderHotwords()}

function saveVersionSnapshot(force=false){const text=transcriptionParts.map(p=>p.text).join('\n');if(!force&&historyVersions[0]?.text===text)return;const id=(historyVersions[0]?.id||0)+1;historyVersions.unshift({id,editor:'当前用户',time:new Date().toLocaleString('zh-CN',{hour12:false}),text});historyVersions=historyVersions.slice(0,10);selectedVersion=id}
function scheduleAutoSave(force=false){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{saveVersionSnapshot(force);if(currentView==='history')renderPage()},600)}
function renderHistory(){const current=transcriptionParts.map(p=>p.text).join('\n'),selected=historyVersions.find(v=>v.id===selectedVersion)||historyVersions[0];return `<div class="notice">系统自动保存编辑版本，最多保留最近10个。恢复所选版本前保留当前快照。</div><div class="grid2 section"><section><div class="row between"><h2 class="section-title">历史版本</h2><span class="subtle">最近 ${historyVersions.length}/10 个</span></div><div class="block version-list" id="versionList">${historyVersions.map(v=>`<div class="version-item ${selectedVersion===v.id?'active':''}" data-version="${v.id}" tabindex="0"><strong>v${v.id}${v.id===historyVersions[0]?.id?' · 最新':''}</strong><small>${esc(v.time)} · ${esc(v.editor)}</small></div>`).join('')}</div><div class="row end section"><button class="btn primary" data-action="restoreVersion">恢复所选版本</button></div></section><section><h2 class="section-title">版本差异</h2><div class="block"><span class="review-label">v${selected.id} · ${esc(selected.editor)}</span><p>${esc(selected.text)}</p></div><div class="block section"><span class="review-label">当前稿</span><p>${esc(current)}</p></div><p class="subtle">恢复前会再次确认。</p></section></div><section class="section block" id="exportFormats"><h2 class="section-title">导出转写稿</h2><div class="row"><label class="format-choice"><input type="checkbox" checked aria-label="导出 DOCX 格式"> DOCX</label><label class="format-choice"><input type="checkbox" aria-label="导出 PDF 格式"> PDF</label><label class="format-choice"><input type="checkbox" aria-label="导出 TXT 格式"> TXT</label><label class="format-choice"><input type="checkbox" aria-label="导出 Markdown 格式"> Markdown</label><label class="format-choice"><input type="checkbox" aria-label="导出 Excel 格式"> Excel</label><label class="row"><input type="checkbox" checked aria-label="导出时保留段落格式"> 保留段落格式</label><label class="row"><input type="checkbox" aria-label="导出时保留编辑痕迹"> 保留编辑痕迹</label><label class="row"><input type="checkbox" aria-label="导出时保留图片"> 保留图片</label></div><div class="row section"><input class="control wide" function renderIntegration(){return `<div class="notice">按任务 ID 管理批量转写任务，查看任务进度、结果及操作日志。</div><div class="grid2 section"><section><h2 class="section-title">接口调用流程</h2><div class="table-wrap"><table><thead><tr><th>方法</th><th>路径</th><th>用途</th></tr></thead><tbody><tr><td>POST</td><td><code>/api/voice/v1/transcriptions:batch</code></td><td>批量提交音频任务</td></tr><tr><td>GET</td><td><code>/api/voice/v1/tasks/{taskId}</code></td><td>查询转写进度</td></tr><tr><td>GET</td><td><code>/api/voice/v1/tasks/{taskId}/result</code></td><td>获取转写结果</td></tr></tbody></table></div><h3 class="section-title section">请求示例</h3><pre class="code">POST /api/voice/v1/transcriptions:batch
