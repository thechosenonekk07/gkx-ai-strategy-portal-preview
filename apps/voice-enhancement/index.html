<div class="shell">

</div>

function compressSeq(nums){const a=[...new Set(nums)].sort((x,y)=>x-y),out=[];for(let i=0;i<a.length;){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;out.push(j-i>=2?`${a[i]}–${a[j]}`:j===i?`${a[i]}`:`${a[i]}, ${a[j]}`);i=j+1}return out.join('、')}

 const modelNote=currentView==='realtime'?`<h3>Qwen3-ASR-1.7B 内部推理说明</h3><p>门户语音网关负责身份校验、会话管理、音频预处理及调用模型；宿主系统只接入门户业务接口/组件。Qwen3-ASR-1.7B通过vLLM服务处理语音，不作为第三方直接接入合同。</p><div class="table-wrap"><table><thead><tr><th>Qwen官方演示路由</th><th>输入</th><th>输出</th></tr></thead><tbody><tr><td><code>POST /api/start</code></td><td>无请求体</td><td><code>session_id</code></td></tr><tr><td><code>POST /api/chunk?session_id={id}</code></td><td>application/octet-stream；16kHz float32 PCM分片</td><td><code>language</code>、当前 <code>text</code></td></tr><tr><td><code>POST /api/finish?session_id={id}</code></td><td>会话ID</td><td>最终 <code>language</code>、<code>text</code></td></tr></tbody></table></div><p>以上是官方演示服务路由，不是模型固定REST合同。粤语、四川话和吴语列入模型支持语言；上海话口音仍需专项验收。</p><p>资料：<a href="https://github.com/QwenLM/Qwen3-ASR" target="_blank" rel="noopener">Qwen3-ASR仓库与流式示例</a> · <a href="https://huggingface.co/Qwen/Qwen3-ASR-1.7B" target="_blank" rel="noopener">模型卡</a></p>`:'';

function fillReviewList(){const list=document.getElementById('reviewList');if(!list)return;const view=views.find(x=>x.id===currentView),rows=reviewData.filter(r=>r.view===view.name);list.innerHTML=rows.length?rows.map(r=>`<details class="review-item" open data-review-seq="${r.seq}"><summary><span class="review-seq">${r.seq}</span><strong>${esc(r.name)}</strong><span class="review-type">${esc(r.delivery)}</span></summary><div class="review-body"><div><span class="review-label">原始需规描述</span><p>${esc(r.requirement)}</p>${r.delivery==='页面交付'?`<button class="link locate-prototype" data-action="locatePrototype" data-seq="${r.seq}">⌖ 定位原型</button>`:''}<span class="review-label">解释角度</span><p>${esc(r.purpose)}</p></div><div>${r.delivery==='页面交付'?`<span class="review-label">页面如何响应需规</span><p>${esc(r.response)}</p><span class="review-label">研发实现建议</span><p>${esc(r.devSuggestion)}</p>`:`<span class="review-label">接口功能 · ${esc(r.apiName||'')}</span><p>${esc(r.apiFunction||r.response)}</p><span class="review-label">接口输入</span><p>${esc(r.apiInput||'')}</p><span class="review-label">接口输出</span><p>${esc(r.apiOutput||'')}</p>`}</div></div></details>`).join(''):`<div class="empty">当前页面没有对应的交付项。</div>`}

"polishMode"><option>口语转书面</option><option>精简50%</option><option>精简70%</option><option>扩写丰富</option><option>语气正式化</option><option>语气亲和化</option></select><button class="btn" data-action="polish">生成对照建议</button></div><div id="grammarPreview" class="section" hidden></div><div id="polishPreview" class="section" hidden></div></section><section class="section block"><div class="row between"><h2 class="section-title">音频校对与辅助结果</h2><div class="row"><button class="btn" data-action="playAudio">播放</button><select class="control" id="playbackSpeed"><option>0.5倍</option><option>1倍</option><option>1.5倍</option><option>2倍</option></select><label class="row"><input type="checkbox" checked id="emotionToggle"> 情感标签</label><label class="row"><input type="checkbox" checked id="punctuationRule"> 自动标点</label></div></div><div class="row section"><label class="subtle">音频进度 <input class="slider" id="audioPosition" type="range" min="0" max="100" value="0" aria-label="音频播放位置"></label><span class="subtle" id="playTime">00:00:04</span><span class="subtle">播放时高亮对应段落</span></div><div class="row section"><select class="control" id="translateLanguage"><option>英文</option><option>日文</option><option>韩文</option><option>法文</option><option>德文</option></select><button class="btn" data-action="translate">翻译</button><button class="btn" id="keywordExtract" data-action="keywords">提取关键词（最多50个）</button><label>摘要长度 <input type="range" id="summaryLength" min="100" max="500" step="50" value="200"><span id="summaryLengthValue">200</span>字</label><button class="btn" data-action="summary">生成摘要</button></div><div id="assistResult" class="notice section">翻译、关键词和摘要结果将在此处展示，可继续编辑或导出。</div></section><div class="row between section"><span class="subtle">共 <b id="editorWordCount"></b> 字 · 拖动音频进度定位段落</span><span class="subtle">自动保存状态：已同步</span></div>`}
function saveVersionSnapshot(force=false){const text=transcriptionParts.map(p=>p.text).join('\n');if(!force&&historyVersions[0]?.text===text)return;const id=(historyVersions[0]?.id||0)+1;historyVersions.unshift({id,editor:'当前用户',time:new Date().toLocaleString('zh-CN',{hour12:false}),text});historyVersions=historyVersions.slice(0,10);selectedVersion=id}
function scheduleAutoSave(force=false){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{saveVersionSnapshot(force);if(currentView==='history')renderPage()},600)}
function renderHistory(){const current=transcriptionParts.map(p=>p.text).join('\n'),selected=historyVersions.find(v=>v.id===selectedVersion)||historyVersions[0];return `<div class="notice">系统自动保存编辑版本，最多保留最近10个。恢复所选版本前保留当前快照。</div><div class="grid2 section"><section><div class="row between"><h2 class="section-title">历史版本</h2><span class="subtle">最近 ${historyVersions.length}/10 个</span></div><div class="block version-list" id="versionList">${historyVersions.map(v=>`<div class="version-item ${selectedVersion===v.id?'active':''}" data-version="${v.id}" tabindex="0"><strong>v${v.id}${v.id===historyVersions[0]?.id?' · 最新':''}</strong><small>${esc(v.time)} · ${esc(v.editor)}</small></div>`).join('')}</div><div class="row end section"><button class="btn primary" data-action="restoreVersion">恢复所选版本</button></div></section><section><h2 class="section-title">版本差异</h2><div class="block"><span class="review-label">v${selected.id} · ${esc(selected.editor)}</span><p>${esc(selected.text)}</p></div><div class="block section"><span class="review-label">当前稿</span><p>${esc(current)}</p></div><p class="subtle">恢复前会再次确认。</p></section></div><section class="section block" id="exportFormats"><h2 class="section-title">导出转写稿</h2><div class="row"><label class="format-choice"><input type="checkbox" checked> DOCX</label><label class="format-choice"><input type="checkbox"> PDF</label><label class="format-choice"><input type="checkbox"> TXT</label><label class="format-choice"><input type="checkbox"> Markdown</label><label class="format-choice"><input type="checkbox"> Excel</label><label class="row"><input type="checkbox" checked> 保留段落格式</label><label class="row"><input type="checkbox"> 保留编辑痕迹</label><label class="row"><input type="checkbox"> 保留图片</label></div><div class="row section"><input class="control wide" id="filenameRule" value="语音转写_{YYYYMMDD}_{主题}" aria-label="导出文件名规则"><span id="exportPreview" class="subtle">预览：语音转写_20261025_访谈记录</span><button class="btn primary" data-action="exportDoc">导 function renderIntegration(){return `<div class="notice">按任务 ID 管理批量转写任务，查看任务进度、结果及操作日志。</div><div class="grid2 section"><section><h2 class="section-title">接口调用流程</h2><div class="table-wrap"><table><thead><tr><th>方法</th><th>路径</th><th>用途</th></tr></thead><tbody><tr><td>POST</td><td><code>/api/voice/v1/transcriptions:batch</code></td><td>批量提交音频任务</td></tr><tr><td>GET</td><td><code>/api/voice/v1/tasks/{taskId}</code></td><td>查询转写进度</td></tr><tr><td>GET</td><td><code>/api/voice/v1/tasks/{taskId}/result</code></td><td>获取转写结果</td></tr></tbody></table></div><h3 class="section-title section">请求示例</h3><pre class="code">POST /api/voice/v1/transcriptions:batch

function updateLiveStats(){const text=document.getElementById('liveTranscript')?.innerText||'';const words=text.replace(/\s/g,'').length;const count=document.getElementById('wordCount');if(count)count.textContent=words}
function formatTime(seconds){const h=String(Math.floor(seconds/3600)).padStart(2,'0'),m=String(Math.floor(seconds%3600/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');return `${h}:${m}:${s}`}
function updateRecordUI(){const timer=document.getElementById('recordTimer'),status=document.getElementById('recordStatus');if(timer)timer.textContent=formatTime(elapsedSeconds);if(status){status.className=`status ${recordState==='recording'?'error':recordState==='paused'?'warn':'info'}`;status.textContent=recordState==='recording'?'正在录入':recordState==='paused'?'已暂停 · 内容已保留':recordState==='ended'?'录入已结束':'等待开始'}const progress=document.getElementById('recordProgressBar');if(progress)progress.style.width=`${Math.min(elapsedSeconds/10800*100,100)}%`;const dur=document.getElementById('recordDuration'),remaining=document.getElementById('remainingDuration');if(dur)dur.textContent=formatTime(elapsedSeconds);if(remaining)remaining.textContent=formatTime(Math.max(0,10800-elapsedSeconds));const start=document.querySelector('[data-action="recordStart"]'),pause=document.querySelector('[data-action="recordPause"]'),resume=document.querySelector('[data-action="recordResume"]'),end=document.querySelector('[data-action="recordEnd"]');if(start)start.disabled=recordState==='recording'||recordState==='paused';if(pause)pause.disabled=recordState!=='recording';if(resume)resume.disabled=recordState!=='paused';if(end)end.disabled=recordState==='idle'||recordState==='ended'}
function startRecording(){if(recordState==='ended'){elapsedSeconds=0;sessionStarted=false}if(elapsedSeconds>=10800){showToast('单次连续录入已达180分钟上限');return}recordState='recording';sessionStarted=true;updateRecordUI();if(!timerHandle)timerHandle=setInterval(()=>{if(recordState==='recording'){elapsedSeconds++;updateRecordUI();if(elapsedSeconds>=10800){recordState='ended';clearInterval(timerHandle);timerHandle=null;updateRecordUI();showToast('已达到单次录入时长上限')}}},1000);}

async function handleAction(btn){const a=btn.dataset.action;
 if(a==='recordStart'){startRecording();showToast('录入已启动');return}
 if(a==='simulateTranscript'){const box=document.getElementById('liveTranscript');if(box){const addition='本次会议重点讨论项目进展和下一阶段安排。';box.textContent=(box.textContent||'').includes('请点击“开始录入”')?addition:(box.textContent+' '+addition);liveTranscriptText=box.innerText;updateLiveStats();showToast('已追加一段转写文本')}return}

 if(a==='addHotword'){addHotwordFrom('sessionHotwordInput');return}
 if(a==='addVocabHotword'){addHotwordFrom('vocabHotword');return}
 if(a==='removeHotword'){hotwords.splice(Number(btn.dataset.index),1);renderHotwords();return}
 if(a==='manageHotwords'){openView('vocab');return}
 if(a==='locateAudio'){const i=Number(btn.dataset.index);selectedPara=i;const range=document.getElementById('audioPosition');if(range)range.value=Math.round((i+1)/transcriptionParts.length*100);document.querySelectorAll('.para').forEach((el,j)=>el.classList.toggle('selected',j===i));showToast('已定位到对应音频位置');return}
 if(a==='toRealtime'){openView('realtime');return}
 if(a==='addLexicon'){const input=document.getElementById('lexiconInput'),value=input.value.trim();if(!value){showToast('请输入词条内容');return}if(lexicon.length>=5000){showToast('单个语义库最多5000条');return}lexicon.push([document.getElementById('lexiconKind').value,value,'启用']);input.value='';renderLexicon();showToast('词条已加入语义库');return}
 if(a==='deleteLexicon'){lexicon.splice(Number(btn.dataset.index),1);renderLexicon();return}

 if(a==='addRule'||a==='newRule'){showModal('添加转写规则',`<div class="field"><label for="ruleType">规则类型</label><select class="control full" id="ruleType"><option>固定词汇替换</option><option>句式格式化</option><option>敏感词过滤</option></select></div><div class="field section"><label for="ruleContent">规则内容</label><input class="control full" id="ruleContent" placeholder="填写规则内容"></div>`,`<button class="btn" data-action="closeModal">取消</button><button class="btn primary" data-action="saveRule">保存规则</button>`);return}
 if(a==='downloadCandidate'){showToast(`${btn.dataset.platform} 离线包暂不可用，请稍后再试`);return}
 if(a==='downloadModel'){showToast('离线包暂不可用，请稍后再试');return}
 if(a==='checkModel'){showToast('暂无可校验的离线包');return}
 if(a==='syncOffline'){offlineSyncStatus='同步完成';const st=document.getElementById('syncStatus');if(st)st.textContent='同步完成 · 本地 v7 / 云端 v7';showToast('离线稿件状态已更新，保留最新编辑版本');return}
 if(a==='splitPara'){const i=btn.dataset.index===undefined?selectedPara:Number(btn.dataset.index),p=transcriptionParts[i];if(!p)return;const m=p.text.match(/^(.{1,30}[，,。；;])(.+)$/);if(!m){showToast('未找到合适的分段位置');return}p.text=m[1];transcriptionParts.splice(i+1,0,{time:p.time,speaker:p.speaker,text:m[2]});selectedPara=i+1;renderEditorData();return}

 if(a==='cleanFillers'){transcriptionParts=transcriptionParts.map(p=>({...p,text:p.text.replace(/\b(嗯|呃|那个|然后然后)\b/g,'').replace(/\s{2,}/g,' ')}));renderEditorData();showToast('已清理语气词');return}
 if(a==='applyFormat'){const value=document.getElementById('formatLevel').value;if(transcriptionParts[selectedPara])transcriptionParts[selectedPara].format=value;document.getElementById('editorSaveState').textContent=`已应用${value}排版`;return}

 if(a==='restoreGrammar'){document.getElementById('grammarPreview').hidden=true;return}
 if(a==='polish'){const old=transcriptionParts.map(p=>p.text).join('\n');const next=old.replace(/本次调研重点是/g,'本次调研的重点在于').replace(/请关注/g,'建议重点关注');const box=document.getElementById('polishPreview');box.hidden=false;box.innerHTML=`<span class="review-label">${esc(document.getElementById('polishMode').value)} · 建议对照</span><p><del>${esc(old.slice(0,160))}</del></p><p>${esc(next.slice(0,160))}</p><button class="btn primary" data-action="acceptPolish">应用建议</button>`;return}
 if(a==='acceptPolish'){transcriptionParts=transcriptionParts.map(p=>({...p,text:p.text.replace(/本次调研重点是/g,'本次调研的重点在于').replace(/请关注/g,'建议重点关注')}));renderEditorData();document.getElementById('polishPreview').hidden=true;showToast('已应用润色建议');return}
 if(a==='translate'){const lang=document.getElementById('translateLanguage').value;document.getElementById('assistResult').textContent=`${lang}译文：This discussion focuses on the technical roadmap for the low-altitude economy, project applications, and follow-up research.`;return}
 if(a==='summary'){const len=Number(document.getElementById('summaryLength').value);document.getElementById('assistResult').textContent=`摘要（目标 ${len} 字）：本次讨论聚焦低空经济技术路线、项目申报变化和后续研判工作。可在此处继续修改摘要。`;return}
 if(a==='keywords'){document.getElementById('assistResult').textContent='关键词（按出现频率）：低空经济、项目申报、技术路线、人工智能、数据治理。';return}
 if(a==='saveSnapshot'){saveVersionSnapshot();showToast('当前稿已保存为新版本');if(currentView==='history')renderPage();return}
 if(a==='restoreVersion'){const chosen=historyVersions.find(v=>v.id===selectedVersion);if(!chosen)return;const restoredVersion=chosen.id;if(!await confirmAction(`确认恢复到 v${restoredVersion}？当前内容将被覆盖。`))return;clearTimeout(autosaveTimer);saveVersionSnapshot();transcriptionParts=chosen.text.split('\n').filter(Boolean).map((text,i)=>({time:formatTime(i*10+4),speaker:'说话人 1',text}));selectedPara=0;scheduleAutoSave(true);showToast(`已恢复到 v${restoredVersion}，并保存恢复记录`);renderEditorData();return}
 if(a==='exportDoc'){const name=document.getElementById('filenameRule').value||'语音转写_{YYYYMMDD}_{主题}';document.getElementById('exportPreview').textContent=`文件名预览：${name.replace('{YYYYMMDD}','20261025').replace('{主题}','访谈记录').replace('{用户}','张研究员')}`;const fmts=[...document.querySelectorAll('.format-choice input:checked')].map(x=>x.parentElement.textContent.trim()).join('、')||'DOCX';showToast(`${fmts} 导出暂不可用，请稍后重试`);return}
 if(a==='submitTask'){const now=String(tasks.length+1).padStart(3,'0'),id=`VT-20261024-${now}`;tasks.unshift({id,file:`${document.getElementById('hostScene').value}音频.wav`,status:'处理中',progress:28,result:'转写任务已排队'});renderTaskRows();logRecords.unshift([tasks[0].file,'2026-10-24 11:06','00:00:00','处理中','未导出']);renderLogRows();showToast(`批量任务已受理，任务 ID：${id}`);return}
 if(a==='queryTasks'){tasks=tasks.map(t=>({...t,status:'已完成',progress:100,result:'已生成转写结果'}));renderTaskRows();showToast('任务进度已更新');return}
 if(a==='viewResult'){const t=tasks.find(x=>x.id===btn.dataset.task);showModal('转写任务结果',`<p><strong>任务 ID：</strong>${esc(t.id)}</p><p><strong>状态：</strong>${esc(t.status)} · ${t.progress}%</p><p><strong>结果：</strong>${esc(t.result)}</p><div class="block">本次调研重点是梳理低空经济领域的核心技术路线……</div>`);return}
 if(a==='exportLogs'){showToast('日志导出暂不可用，请稍后重试');return}
 if(a==='copyApi'){showToast('请选中接口示例内容后复制');return}
 if(a==='uploadAudio'){document.getElementById('audioFile')?.click();return}
 if(a==='closeModal'){closeModal();return}
 if(a==='saveRule'){const value=document.getElementById('ruleContent').value.trim();if(!value){showToast('请填写规则内容');return}customRules.push([document.getElementById('ruleType').value,value,true]);closeModal();renderCustomRules();showToast('规则已加入当前语义库');return}
 if(a==='saveSpeaker'){const i=Number(btn.dataset.index),name=document.getElementById('speakerName').value.trim();if(name)transcriptionParts[i].speaker=name;closeModal();renderEditorData();return}
 showToast('操作已完成')
}
nav.addEventListener('click',e=>{const item=e.target.closest('[data-page]');if(item){openView(item.dataset.page);return}const group=e.target.closest('.group-name');if(group){const box=group.nextElementSibling;box.hidden=!box.hidden;group.setAttribute('aria-expanded',String(!box.hidden))}});
page.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){handleAction(btn);return}const version=e.target.closest('[data-version]');if(version){selectedVersion=Number(version.dataset.version);openView('history');return}const para=e.target.closest('.para');if(para)selectedPara=Number(para.dataset.para)});
page.addEventListener('input',e=>{const ix=e.target.dataset.textIndex;if(ix!==undefined){transcriptionParts[Number(ix)].text=e.target.innerText;selectedPara=Number(ix);const cnt=document.getElementById('editorWordCount');if(cnt)cnt.textContent=transcriptionParts.map(x=>x.text.replace(/\s/g,'').length).reduce((a,b)=>a+b,0);scheduleAutoSave()}if(e.target.id==='liveTranscript'){liveTranscriptText=e.target.innerText;updateLiveStats()}});
page.addEventListener('change',e=>{if(e.target.dataset.ruleToggle!==undefined){customRules[Number(e.target.dataset.ruleToggle)][2]=e.target.checked;showToast('规则状态已更新')}if(e.target.id==='paraSpacing'){document.querySelectorAll('.para').forEach(el=>el.style.marginBottom=e.target.value+'px')}if(e.target.id==='audioPosition'){const i=Math.min(transcriptionParts.length-1,Math.floor(Number(e.target.value)/100*transcriptionParts.length));selectedPara=i;document.querySelectorAll('.para').forEach((el,j)=>el.classList.toggle('selected',j===i));const t=document.getElementById('playTime');if(t)t.textContent=transcriptionParts[i]?.time||'00:00:00'}if(e.target.id==='summaryLength')document.getElementById('summaryLengthValue').textContent=e.target.value;if(e.target.id==='templateSelect'&&e.target.value){const template=e.target.value;transcriptionParts.unshift({time:'',speaker:'',text:`${template}：标题\n一、背景\n二、主要内容\n三、结论与建议`});renderEditorData();showToast('模板结构已插入，可继续填写')}if(e.target.id==='hostSystem'||e.target.id==='hostScene'){const note=document.querySelector('.context-note');if(note)note.textContent=`当前组件目标：${e.target.id==='hostSystem'?e.target.value:document.getElementById('hostSystem').value} · ${e.target.id==='hostScene'?e.target.value:document.getElementById('hostScene').value}`}});
page.addEventListener('change',e=>{if(e.target.dataset.lexiconEdit!==undefined){lexicon[Number(e.target.dataset.lexiconEdit)][1]=e.target.value;showToast('词条已更新')}if(e.target.id==='audioFile'&&e.target.files.length){const f=e.target.files[0];showToast(`已选择音频：${f.name}`)}if((e.target.id==='lexiconFile'||e.target.id==='ruleFile')&&e.target.files.length){showToast(`已选择 ${e.target.files[0].name}，请确认导入内容`)}if(e.target.id==='customTemplate'&&e.target.files.length)showToast(`已选择模板 ${e.target.files[0].name}`)});
page.addEventListener('dragstart',e=>{const para=e.target.closest('.para');if(para){e.dataTransfer.setData('text/plain',para.dataset.para);para.classList.add('dragging')}});
page.addEventListener('dragend',e=>e.target.closest('.para')?.classList.remove('dragging'));
page.addEventListener('dragover',e=>{const target=e.target.closest('.para');if(target)e.preventDefault()});
page.addEventListener('drop',e=>{const target=e.target.closest('.para');if(!target)return;e.preventDefault();const from=Number(e.dataTransfer.getData('text/plain')),to=Number(target.dataset.para);reorderParas(from,to)});
function setReviewOpen(open){const returnReviewFocus=!open&&reviewDrawer.contains(document.activeElement);reviewMode=open;shell.classList.toggle('review-open',open);const toggle=document.getElementById('reviewToggle');toggle.setAttribute('aria-pressed',String(open));toggle.textContent=`评审模式：${open?'开':'关'}`;const sourceId=page.querySelector('.source-id');if(sourceId)sourceId.hidden=!open;if(open){reviewDrawer.innerHTML=renderReview();fillReviewList()}if(returnReviewFocus)toggle.focus({preventScroll:true})}
document.getElementById('reviewToggle').addEventListener('click',()=>setReviewOpen(!reviewMode));
reviewDrawer.addEventListener('click',e=>{const locate=e.target.closest('[data-action="locatePrototype"]');if(locate){locatePrototype(locate.dataset.seq);return}if(e.target.closest('[data-action="closeReview"]')){setReviewOpen(false)}});
modal.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn)handleAction(btn)});
document.getElementById('modalMask').addEventListener('click',e=>{if(e.target===modalMask)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function init(){document.getElementById('hostSystem').addEventListener('change',e=>{const l=document.getElementById('hostLabel');if(l)l.textContent=e.target.value;const f=document.getElementById('hostFieldName');if(f)f.textContent=document.getElementById('hostScene').value});document.getElementById('hostScene').addEventListener('change',e=>{const l=document.getElementById('sceneLabel');if(l)l.textContent=e.target.value;const f=document.getElementById('hostFieldName');if(f)f.textContent=e.target.value});renderPage();document.getElementById('summaryLength')?.dispatchEvent(new Event('change',{bubbles:true}));}
init();

</script>
